name: Copiloto WIN 2.0 - backend Hatchable (offline)
on:
  push:
    branches: [feature/copiloto-v2-marketdata-readonly-20261010]
    paths:
      - 'copiloto_v2/hatchable/**'
      - '.github/workflows/copiloto-v2-hatchable-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes de API sem dados reais
        working-directory: copiloto_v2/hatchable
        run: npm test
